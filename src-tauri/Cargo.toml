[package]
name = "rusty-ide"
version = "0.1.70"
description = "AI-assisted coding IDE"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "rusty_ide_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = ["core-harness"]
# HARNESS_CONTRACT_PLAN.md Milestone B0: the sign/notarize spike. Linking
# rusty-core pulls libgit2-sys + libz-sys (via rusty-workspace's git2
# dependency) into a bundle that has had zero native deps until now --
# gated behind a feature (not just added straight to [dependencies]) so a
# build can drop back to the pre-B0 dependency graph by turning this off,
# without a Cargo.toml edit, if the spike turns up a real blocker.
core-harness = [
  "dep:rusty-engine",
  "dep:rusty-protocol",
  "dep:rusty-context",
  "dep:rusty-tool-api",
  "dep:rusty-workspace",
  "dep:rusty-repo-model",
  "dep:rusty-git-analysis",
  "dep:rusty-findings",
  "dep:rusty-tool-repo",
  "dep:rusty-repo-wiki",
  "dep:rusty-code-analysis",
  "dep:rusty-code-health",
  "dep:rusty-guidelines",
  "dep:rusty-goals",
  "dep:rusty-infra-analysis",
  "dep:rusty-specs",
  "dep:rusty-context-repo",
  "dep:rusty-lang-api",
  "dep:rusty-frameworks",
  "dep:rusty-lang-python",
  "dep:rusty-lang-go",
  "dep:rusty-lang-java",
  "dep:rusty-lang-csharp",
  "dep:rusty-lang-php",
  "dep:rusty-lang-native",
  "dep:rusty-runtime",
  "dep:rusty-workflow-runtime",
  "dep:rusty-provider-anthropic",
  "dep:rusty-provider-openai",
  "dep:rusty-provider-openai-responses",
  "dep:rusty-provider-openai-compatible",
  "dep:rusty-provider-gemini",
  "dep:rusty-provider-codex",
  "dep:rusty-provider-github-copilot",
  "dep:rusty-tool-mcp",
  "dep:rusty-tool-web",
  "dep:git2",
  "dep:async-trait",
  "dep:tokio-util",
  "dep:reqwest",
]

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
regex = "1.10"
ignore = "0.4.22"
fuzzy-matcher = "0.3.7"
tauri-plugin-window-state = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
portable-pty = "0.8"
notify = "8"
base64 = "0.22"
# secure_key.rs: CSPRNG for this installation's secret-storage key (see
# that module's doc comment for why the key can no longer be a hardcoded
# string in the shipped frontend bundle).
rand = "0.8"
flate2 = "1"
tar = "0.4"
sha2 = "0.10"
tempfile = "3"
# "process"/"time": test_build's own one-shot command execution
# (shell_exec.rs) -- tokio::process::Command + tokio::time::timeout.
tokio = { version = "1", features = ["sync", "rt", "macros", "process", "time", "fs", "io-util"] }

# Path deps into the sibling rusty-core checkout (HARNESS_CONTRACT_PLAN.md
# §2 "During the transition"). Every one of these is a genuine build-time
# risk the B0 spike exists to surface, not just the crate the Milestone B
# bridge will actually call into (rusty-engine) -- the seven integration
# crates each bring their own transitive dependencies (HTTP clients, CLI
# process spawning), and the binary-size delta this spike measures should
# reflect the real Milestone B dependency graph, not a trimmed subset of it.
rusty-engine = { path = "../../rusty-core/crates/engine", optional = true }
rusty-protocol = { path = "../../rusty-core/crates/protocol", optional = true }
rusty-context = { path = "../../rusty-core/crates/context", optional = true, features = ["jev-http"] }
rusty-tool-api = { path = "../../rusty-core/crates/tool-api", optional = true }
rusty-workspace = { path = "../../rusty-core/crates/workspace", optional = true }
rusty-repo-model = { path = "../../rusty-core/crates/repo-model", optional = true }
rusty-runtime = { path = "../../rusty-core/crates/runtime", optional = true }
rusty-workflow-runtime = { path = "../../rusty-core/crates/workflow-runtime", optional = true }
# Repository intelligence (architecture canvas): import graph, dependency groups, Git history, findings.
rusty-git-analysis = { path = "../../rusty-core/crates/git-analysis", optional = true }
rusty-findings = { path = "../../rusty-core/crates/findings", optional = true }
rusty-context-repo = { path = "../../rusty-core/crates/context-repo", optional = true }
rusty-repo-wiki = { path = "../../rusty-core/crates/repo-wiki", optional = true }
rusty-code-analysis = { path = "../../rusty-core/crates/code-analysis", optional = true }
rusty-code-health = { path = "../../rusty-core/crates/code-health", optional = true }
rusty-guidelines = { path = "../../rusty-core/crates/guidelines", optional = true }
rusty-goals = { path = "../../rusty-core/crates/goals", optional = true }
rusty-infra-analysis = { path = "../../rusty-core/crates/infra-analysis", optional = true }
rusty-specs = { path = "../../rusty-core/crates/specs", optional = true }
rusty-tool-repo = { path = "../../rusty-core/crates/tool-repo", optional = true }
rusty-lang-api = { path = "../../rusty-core/crates/lang-api", optional = true }
rusty-frameworks = { path = "../../rusty-core/crates/frameworks", optional = true }
rusty-lang-python = { path = "../../rusty-core/crates/lang-python", optional = true }
rusty-lang-go = { path = "../../rusty-core/crates/lang-go", optional = true }
rusty-lang-java = { path = "../../rusty-core/crates/lang-java", optional = true }
rusty-lang-csharp = { path = "../../rusty-core/crates/lang-csharp", optional = true }
rusty-lang-php = { path = "../../rusty-core/crates/lang-php", optional = true }
rusty-lang-native = { path = "../../rusty-core/crates/lang-native", optional = true }
rusty-provider-anthropic = { path = "../../rusty-core/crates/provider-anthropic", optional = true }
rusty-provider-openai = { path = "../../rusty-core/crates/provider-openai", optional = true }
rusty-provider-openai-responses = { path = "../../rusty-core/crates/provider-openai-responses", optional = true }
rusty-provider-openai-compatible = { path = "../../rusty-core/crates/provider-openai-compatible", optional = true }
rusty-provider-gemini = { path = "../../rusty-core/crates/provider-gemini", optional = true }
rusty-provider-codex = { path = "../../rusty-core/crates/provider-codex", optional = true }
rusty-provider-github-copilot = { path = "../../rusty-core/crates/provider-github-copilot", optional = true }
# Phase 6 (HARNESS_CONTRACT_PLAN.md-adjacent, see the plan doc): closes the
# "no MCP servers"/"no web search" v1 gaps for global_explore/execute_node/
# agent_chat. Both already have complete, tested implementations upstream --
# this just makes them reachable from `rusty`'s own `recipe.rs`.
rusty-tool-mcp = { path = "../../rusty-core/crates/tool-mcp", optional = true }
rusty-tool-web = { path = "../../rusty-core/crates/tool-web", optional = true }
# Same version rusty-workspace itself depends on (its workspace root pins
# "0.21") -- named directly here so src-tauri/src/harness/host_workspace.rs
# can make a real libgit2 FFI call (B0's own proof of linkage; B1 reuses it
# for HostWorkspace's constructor path).
git2 = { version = "0.21", optional = true }
# Same versions rusty-core's own workspace root pins -- needed directly by
# src-tauri/src/harness/*.rs's own `#[async_trait]` impls (Workspace,
# ToolExecutor) and `CancellationToken` usage (HostBridge, HostWorkspace,
# HostToolExecutor), not just transitively through the path deps above.
async-trait = { version = "0.1", optional = true }
tokio-util = { version = "0.7", optional = true }
# managed_binaries.rs's runtime downloads. Same version/TLS backend
# rusty-core's own integrations already pull in (rustls), so this adds no
# new native dependency.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"], optional = true }

# shell_exec.rs's cancel path kills the command's whole process group
# (`libc::kill(-pgid, SIGKILL)`) so a build tool's own children die with
# it; already in the tree transitively via tokio, named here for the one
# direct FFI call.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# secure_key/keychain.rs: the storage master key lives in the OS credential
# store. keyring-core plus one store per platform (rather than the `keyring`
# all-in-one crate, whose docs steer apps away from it). The Linux store is
# zbus-based -- pure Rust, so no libdbus at build or run time.
[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
keyring-core = "1"

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1", features = ["keychain"] }
mac-usernotifications = "0.3.1"

[target.'cfg(target_os = "linux")'.dependencies]
zbus-secret-service-keyring-store = { version = "1", features = ["crypto-rust"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
# Enables rusty-runtime's `testing` feature (FakeBackend, used by the
# harness module's own integration test) for `cargo test` only -- Cargo
# unifies features across profiles, so this doesn't reach the release
# build, mirroring rusty-engine's own Cargo.toml pattern for the same
# crate/feature. Not `optional`: dev-dependencies are already excluded
# from a non-test build, so there's nothing further to gate.
rusty-runtime = { path = "../../rusty-core/crates/runtime", features = ["testing"] }
