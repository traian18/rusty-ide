name: Release macOS

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write # needed for `gh release create`

jobs:
  build-sign-notarize:
    runs-on: macos-14 # Apple Silicon (aarch64) runner
    # A release normally takes 15-20 minutes (RELEASING.md); the headroom is
    # for Apple's notarization queue, which is sometimes slow.
    timeout-minutes: 45
    defaults:
      run:
        working-directory: rusty-ide
    steps:
      # Actions are pinned to the commit their tag pointed to when reviewed
      # (the tag in the trailing comment), so the tag's owner cannot change
      # what a release runs.
      - name: Checkout rusty-ide
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: rusty-ide

      # rusty-core (the Rust harness engine) is a separate repo, consumed via
      # plain `path = "../../rusty-core/..."` Cargo dependencies (see
      # src-tauri/Cargo.toml) rather than a git/crates.io dependency --
      # RUSTY_CORE_INTEGRATION_PLAN.md's own phased plan, still in its first
      # ("during the transition") phase. That means it has to be checked out
      # as a sibling of this checkout for the path deps to resolve at all;
      # Both repositories are checked out below $GITHUB_WORKSPACE, so
      # rusty-core is a sibling of rusty-ide, matching local development and
      # matching the `../../rusty-core` layout `src-tauri/Cargo.toml` expects
      # relative to `src-tauri/`. Tracks rusty-core's own `main` -- there is
      # no pinned rev to bump here, consistent with local dev, which always
      # builds against whatever's currently checked out in the sibling folder.
      - name: Checkout rusty-core
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: traian18/rusty-core
          ref: main
          path: rusty-core

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      # The `stable` branch's commit; it installs the stable toolchain.
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: aarch64-apple-darwin

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix ../rusty-core/sdk/typescript

      - name: Import Developer ID certificate
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: bash .github/scripts/import-signing-certificate.sh

      - name: Write notarization API key
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/private_keys"
          printf '%s' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/private_keys/AuthKey.p8"

      - name: Build, sign, and notarize app
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY_ID }}
          # Signs the updater artifact (the `.app.tar.gz` + `.sig` pair
          # `createUpdaterArtifacts: true` in tauri.conf.json makes `tauri
          # build` emit alongside the `.app`) with the keypair the updater
          # plugin verifies against via tauri.conf.json's `plugins.updater
          # .pubkey` -- unrelated to the Apple Developer ID cert above, which
          # only covers macOS Gatekeeper, not the updater's own signature.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          export APPLE_API_KEY_PATH="$RUNNER_TEMP/private_keys/AuthKey.p8"
          set -o pipefail
          if ! npm run tauri build -- --bundles app 2>&1 | tee "$RUNNER_TEMP/tauri-build.log"; then
            # Job logs need a GitHub login to read, but annotations are public:
            # surface the end of the build output there so a failed release can
            # be diagnosed without downloading logs.
            # Colours and the long "Compiling" run-up are noise; keep the end of what is left.
            TAIL="$(perl -pe 's/\e\[[0-9;]*[A-Za-z]//g' "$RUNNER_TEMP/tauri-build.log" | grep -v '^ *Compiling ' | tail -n 60 | tr '\r\n' '||' | tail -c 5500)"
            echo "::error title=tauri build failed::${TAIL}"
            exit 1
          fi

      - name: Package and sign DMG
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          APP="src-tauri/target/release/bundle/macos/Rusty-IDE.app"
          VERSION="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          OUT="Rusty-IDE_${VERSION}_aarch64.dmg"
          STAGING="$(mktemp -d)"

          cp -R "$APP" "$STAGING/"
          ln -s /Applications "$STAGING/Applications"
          hdiutil create -volname "Rusty-IDE" -srcfolder "$STAGING" -ov -format UDZO "$OUT"
          codesign --force --options runtime --timestamp --sign "$APPLE_SIGNING_IDENTITY" "$OUT"

          echo "DMG_PATH=$OUT" >> "$GITHUB_ENV"
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "DMG_SHA256=$(shasum -a 256 "$OUT" | cut -d' ' -f1)" >> "$GITHUB_ENV"

      - name: Verify notarization
        run: |
          xcrun stapler validate "src-tauri/target/release/bundle/macos/Rusty-IDE.app"
          spctl -a -vvv --type execute "src-tauri/target/release/bundle/macos/Rusty-IDE.app"

      - name: Prepare updater manifest
        run: bash .github/scripts/write-updater-manifest.sh src-tauri/target/release/bundle/macos darwin-aarch64

      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" "$DMG_PATH" "$UPDATER_ARCHIVE" latest.json \
            --repo "${{ github.repository }}" \
            --title "Rusty-IDE ${{ github.ref_name }}" \
            --notes "macOS build, signed with a Developer ID certificate and notarized by Apple. Apple Silicon (aarch64) only." \
            || gh release upload "${{ github.ref_name }}" "$DMG_PATH" "$UPDATER_ARCHIVE" latest.json --clobber --repo "${{ github.repository }}"

      - name: Update Homebrew tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/traian18/homebrew-rusty.git" tap
          cd tap
          sed -i '' "s/version \".*\"/version \"$APP_VERSION\"/" Casks/rusty-ide.rb
          sed -i '' "s/sha256 \".*\"/sha256 \"$DMG_SHA256\"/" Casks/rusty-ide.rb
          git -c user.name="rusty-release-bot" -c user.email="actions@users.noreply.github.com" commit -am "rusty-ide ${APP_VERSION}"
          git push

      - name: Clean up keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" || true
