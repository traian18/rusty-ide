name: Release Windows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: rusty-ide
    steps:
      - name: Checkout rusty-ide
        uses: actions/checkout@v4
        with:
          path: rusty-ide

      # See release.yml's own comment on this step: rusty-core is a separate
      # repo consumed via plain `path = "../../rusty-core/..."` Cargo
      # dependencies, so it needs to be checked out as a sibling of this repo
      # for the build to resolve at all. Tracks `main`, same as local dev.
      - name: Checkout rusty-core
        uses: actions/checkout@v4
        with:
          repository: traian18/rusty-core
          ref: main
          path: rusty-core

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rusty-ide/src-tauri/target
            rusty-core/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rusty-ide/src-tauri/Cargo.lock', 'rusty-core/Cargo.lock') }}

      - name: Install dependencies
        run: npm ci

      # Produces both installers. No code signing — the .exe/.msi are unsigned,
      # so users get a SmartScreen "unknown publisher" prompt on first launch.
      - name: Build (NSIS + MSI)
        run: npm run tauri build -- --bundles nsis,msi

      - name: Collect artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-artifacts | Out-Null
          Get-ChildItem -Recurse -Path src-tauri/target/release/bundle `
            -Include *.exe, *.msi |
            ForEach-Object { Copy-Item $_.FullName dist-artifacts/ }
          Get-ChildItem dist-artifacts

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Rusty-IDE-windows-x86_64
          path: rusty-ide/dist-artifacts/*
